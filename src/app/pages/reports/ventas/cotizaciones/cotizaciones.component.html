<div class="container-all">


  <div class="mat-elevation-z8">
    <app-titulo-pagina [titulo]="titulo"></app-titulo-pagina>

    <div class="demo-button-container">
      <mat-form-field class="buscador-ticket buscador-item">
        <input matInput (keyup)="applyFilter($event.target)" placeholder="Buscar:">
      </mat-form-field>

      <div class="">
        <button (click)="downloadPDF()" mat-raised-button class="botones-acciones rojo" >
          PDF <i class="fas fa-download ml-3"></i>
        </button>
      </div>
      <div class="">
        <button (click)="downloadExcel()" mat-raised-button class="botones-acciones verde" [color]="verde">
          EXCEL <i class="fas fa-download ml-3"></i>
        </button>
      </div>


      <div class="form-floating buscador-ticket">
          <input type="date" class="form-control box-shadow-rojo borde-rojo"
          [(ngModel)]="fechaInicial"
          (change)="validarFechaInicial($event.target)"
          >
          <label for="floatingSelect">Fecha Inicial</label>
      </div>

      <div class="form-floating buscador-ticket">
        <input type="date" class="form-control box-shadow-rojo borde-rojo  "
        [(ngModel)]="fechaFinal"
        (change)="validarFechaFinal($event.target)"
        >
        <label for="floatingSelect">Fecha Final</label>
      </div>



    </div>

      <div class="">
        <button (click)="aplicarFiltros()" mat-raised-button class="botones-acciones rojo">
          APLICAR FILTROS <i class="fas fa-filter ml-3"></i>
        </button>
      </div>
    <table id="my-table" mat-table [dataSource]="dataSource" matSort >

      <!-- displayedColumns: any[] = [
      'cotizacion',
      'ticket',
      'fecha',
      'cliente',
      'total',
      'vendedor',
      'estatus'
    ]; -->

      <ng-container matColumnDef="cotizacion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Cotización </th>
        <td mat-cell *matCellDef="let element"> {{element.cotizacion}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <ng-container matColumnDef="ticket">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Ticket </th>
        <td mat-cell *matCellDef="let element"> {{element.ticket}} </td>
        <td mat-footer-cell *matFooterCellDef>  </td>
      </ng-container>

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Fecha </th>
        <td mat-cell *matCellDef="let element"> {{element.fecha}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="cliente">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Cliente </th>
        <td mat-cell *matCellDef="let element"> {{element.cliente}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="total">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Total </th>
        <td mat-cell *matCellDef="let element"> {{element.total | currency}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="vendedor">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Vendedor </th>
        <td mat-cell *matCellDef="let element"> {{element.vendedor}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="estatus">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Estatus </th>
        <td mat-cell *matCellDef="let element"> {{element.estatus}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>


      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns; sticky: true"></tr>

    </table>

    <mat-paginator pageSize="10" [pageSizeOptions]="[5, 10, 25, 100]" class="items-center" ></mat-paginator>
  </div>

</div>
