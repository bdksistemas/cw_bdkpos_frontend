<div class="container-all">


  <div class="mat-elevation-z8">
    <app-titulo-pagina [titulo]="titulo"></app-titulo-pagina>

    <div class="demo-button-container">
      <mat-form-field class="buscador-ticket buscador-item">
        <input matInput (keyup)="applyFilter($event.target)" placeholder="Buscar:">
      </mat-form-field>

      <div class="">
        <button (click)="downloadPDF()" mat-raised-button class="botones-acciones rojo" >
          PDF <i class="fas fa-download ml-3"></i>
        </button>
      </div>
      <div class="">
        <button (click)="downloadExcel()" mat-raised-button class="botones-acciones verde" [color]="verde">
          EXCEL <i class="fas fa-download ml-3"></i>
        </button>
      </div>


      <div class="form-floating buscador-ticket">
          <input type="date" class="form-control box-shadow-rojo borde-rojo"
          [(ngModel)]="fechaInicial"
          (change)="validarFechaInicial($event.target)"
          >
          <label for="floatingSelect">Fecha Inicial</label>
      </div>

      <div class="form-floating buscador-ticket">
        <input type="date" class="form-control box-shadow-rojo borde-rojo  "
        [(ngModel)]="fechaFinal"
        (change)="validarFechaFinal($event.target)"
        >
        <label for="floatingSelect">Fecha Final</label>
      </div>



      <div class="form-floating buscador-ticket">
        <select (change)="cambioSucusal($event)" class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
          @for (item of sucursales; track $index) {
            <option value="{{item.sucursal}}">{{item.empresa}} </option>
          }
        </select>
        <label for="floatingSelect">Selecciona Sucursal</label>
      </div>

       <!-- Recorremos las categorias -->
       <!-- <div class="form-floating buscador-ticket">

        <select (change)="cambioCategoria($event)" class="form-select box-shadow-rojo borde-rojo" id="floatingSelect" aria-label="Floating label select example">
          <option value="0">TODAS LAS CATEGORÍAS</option>
          @for (item of categorias; track $index) {
            <option value="{{item.categoria}}">{{item.nomcategoria}} </option>
          }
        </select>
        <label for="floatingSelect">Selecciona Categoría</label>
      </div> -->

    </div>
    <table id="my-table" mat-table [dataSource]="dataSource" matSort >

      <!-- displayedColumns: any[] =  [
      "nombre",
      "telefono",
      "correo",
      "credito",
      "limite",
      "saldo",
      "ultimo_pago",
      "direccion"
  ]; -->

      <!-- LIstado de columas con ng-container -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
        <td mat-cell *matCellDef="let element"> {{element.nombre}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="telefono">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Telefono </th>
        <td mat-cell *matCellDef="let element"> {{element.telefono}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="correo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Correo </th>
        <td mat-cell *matCellDef="let element"> {{element.correo}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="credito">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Credito </th>
        <td mat-cell *matCellDef="let element"> {{element.credito}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="limite">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Limite </th>
        <td mat-cell *matCellDef="let element"> {{element.limite  | currency}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="saldo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Saldo </th>
        <td mat-cell *matCellDef="let element"> {{element.saldo | currency}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="ultimo_pago">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Ultimo Pago </th>
        <td mat-cell *matCellDef="let element"> {{element.ultimo_pago}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>

      <ng-container matColumnDef="direccion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Direccion </th>
        <td mat-cell *matCellDef="let element"> {{element.direccion}} </td>
        <td mat-footer-cell *matFooterCellDef> </td>
      </ng-container>



      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr mat-footer-row *matFooterRowDef="displayedColumns; sticky: true"></tr>

    </table>

    <mat-paginator pageSize="10" [pageSizeOptions]="[5, 10, 25, 100]" class="items-center" ></mat-paginator>
  </div>

</div>
