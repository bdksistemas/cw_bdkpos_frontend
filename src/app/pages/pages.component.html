<mat-sidenav-container class="sidenav-container">
  <!-- Poner "openeed dentro del mat-sidenav para poder dejarla abierta siempre" -->
  <mat-sidenav
    #drawer
    class="sidenav color-primario"
    style="width: 300px; padding: 5px"
    #sidenav
  >
    <mat-toolbar class="color-primario">
      <div class="contain-img-log">
        <img
          src="./assets/img/LOGO_BDKPOS_GRALBLANCO.png"
          alt="AdminLTE Logo"
          style="opacity: 0.8; width: 150px"
        />
      </div>
    </mat-toolbar>
    <!-- CREAMOS UN NAV LIST CON DROPDWON CADA UNO -->
    <hr class="hr-item" />

    <div class="user-panel">
      <div class="info-user">
        <a class="text-user-name">{{ nombreUsuario }}</a>
      </div>
    </div>

    <hr class="hr-item" />

    <mat-nav-list>
      <ng-container *ngFor="let item of menuItems; let i = index">
        <mat-expansion-panel
          *ngIf="submenus[item.titulo]"
          class="items-sidenav"
          [expanded]="expandedPanel === i + 1"
          (opened)="setExpandedPanel(i + 1)"
          (closed)="setExpandedPanel(null)"
        >
          <mat-expansion-panel-header>
            <mat-panel-title>
              <i class="{{ item.icono }}" style="margin-right: 10px"></i>
              {{ item.titulo }}
            </mat-panel-title>
          </mat-expansion-panel-header>

          <mat-list>
            <mat-list-item
              class="submenu-item"
              *ngFor="let subMenuItem of item.submenu"
              routerLink="{{ subMenuItem.url }}"
              (click)="sidenav.close()"
            >
              <span mat-line>{{ subMenuItem.titulo }}</span>
            </mat-list-item>
          </mat-list>
        </mat-expansion-panel>
      </ng-container>

      <!-- Panel de Configuración/Salir -->
      <mat-expansion-panel
        class="items-sidenav"
        [expanded]="expandedPanel === menuItems.length + 1"
        (opened)="setExpandedPanel(menuItems.length + 1)"
        (closed)="setExpandedPanel(null)"
      >
        <mat-expansion-panel-header>
          <mat-panel-title>
            <i class="fas fa-cogs ml-1" style="margin-right: 10px"></i>
            CONFIGURACIÓN
          </mat-panel-title>
        </mat-expansion-panel-header>
        <mat-list>
          <mat-list-item
            class="submenu-item"
            (click)="logout()"
            (click)="sidenav.close()"
          >
            <span mat-line>Salir</span>
          </mat-list-item>
        </mat-list>
      </mat-expansion-panel>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="color-primario toolbar-principal">
      <button
        type="button"
        aria-label="Toggle sidenav"
        mat-icon-button
        (click)="drawer.toggle()"
      >
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <div class="contain-img-log">
        <img
          src="./assets/img/LOGO_BDKPOS_GRALBLANCO.png"
          alt="AdminLTE Logo"
          style="opacity: 0.8; width: 150px"
        />
      </div>
    </mat-toolbar>
    <div class="router-container">
      <router-outlet></router-outlet>
      <!-- <app-footer></app-footer> -->
    </div>
    <div class="footer-toolbar main-footer">
      <div class="float-right d-none d-sm-block"></div>
      <strong style="color: white" class="letras-footer"
        ><a
          href="https://www.bdksistemas.com.mx/"
          target="_blank"
          style="color: #b90d0d"
          class="letras-footer"
          >BDKSISTEMAS S.A. DE C.V</a
        >
        | Soporte Técnico: (+52) 81 4171 6458 | Lun a Vie de 9 am a 7:45 pm,
        Sábados de 9 am a 5:45 pm</strong
      >
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
