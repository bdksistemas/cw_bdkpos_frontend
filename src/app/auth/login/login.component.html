<section
  class="h-100 gradient-form"
  style="background-color: #eee; overflow: hidden"
>
  <div class="container py-5 h-100">
    <div
      class="row d-flex justify-content-center align-items-center h-100 animate__animated animate__backInUp container-card"
    >
      <div class="col-xl-10" style="background-color: transparent">
        <div class="card rounded-3 text-black">
          <div class="row g-0 box-shadows" style="margin: 0px">
            <div class="col-lg-6">
              <div class="card-body p-md-5 mx-md-4">
                <div class="text-center mt-5 container-img">
                  <img
                    src="./assets/img/LOGO_BDKPOS_GRAL.png"
                    style="width: 270px"
                    alt="logo"
                    class="img-logo"
                  />
                  <h4 class="mt-2 mb-5 pb-1" [style.font-size]="titulosize">
                    {{ titulo }}
                  </h4>
                </div>

                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                  <div class="flex text-center">
                    <p>Ingresa tus datos de cliente.</p>
                  </div>
                  <mat-form-field
                    appearance="outline"
                    [color]="
                      loginForm.controls['idcw'].valid ? 'accent' : 'warn'
                    "
                  >
                    <mat-label
                      [ngClass]="{
                        'label-valid': loginForm.controls['idcw'].valid
                      }"
                    >
                      Ingresa ID:
                    </mat-label>
                    <input
                      type="number"
                      matInput
                      placeholder="Ej. XXX25"
                      formControlName="idcw"
                      name="idcw"
                      autocomplete="off"
                      [ngClass]="{
                        'label-valid': loginForm.controls['idcw'].valid
                      }"
                    />
                  </mat-form-field>

                  <mat-form-field
                    appearance="outline"
                    [color]="
                      loginForm.controls['cwuser'].valid ? 'accent' : 'warn'
                    "
                  >
                    <mat-label
                      [ngClass]="{
                        'label-valid': loginForm.controls['cwuser'].valid
                      }"
                      >Ingresa Correo:</mat-label
                    >
                    <input
                      type="email"
                      matInput
                      placeholder="Ej. user@bdksistemas.com"
                      formControlName="cwuser"
                      name="username"
                      autocomplete="username"
                      [ngClass]="{
                        'label-valid': loginForm.controls['cwuser'].valid
                      }"
                    />
                  </mat-form-field>

                  <mat-form-field
                    appearance="outline"
                    [color]="
                      loginForm.controls['cwpassword'].valid ? 'accent' : 'warn'
                    "
                  >
                    <mat-label
                      [ngClass]="{
                        'label-valid': loginForm.controls['cwpassword'].valid
                      }"
                      >Ingresa Password:</mat-label
                    >
                    <input
                      [type]="hide ? 'password' : 'text'"
                      matInput
                      placeholder="Ej. passw0rd3x4amp!eñ"
                      formControlName="cwpassword"
                      name="password"
                      autocomplete="current-password"
                      [ngClass]="{
                        'label-valid': loginForm.controls['cwpassword'].valid
                      }"
                    />
                    <button
                      type="button"
                      mat-icon-button
                      matSuffix
                      (click)="hide = !hide"
                      [attr.aria-label]="'Hide password'"
                      [attr.aria-pressed]="hide"
                    >
                      <mat-icon>{{
                        hide ? "visibility_off" : "visibility"
                      }}</mat-icon>
                    </button>
                  </mat-form-field>

                  <div class="form-check mb-3">
                    <label>
                      <input type="checkbox" class="form-check-input" formControlName="recordar" />
                      <span class="form-check-label">Recordar ID y correo</span>
                    </label>
                  </div>

                  <div class="text-center pt-1 mb-5 pb-1">
                    <button
                      type="submit"
                      id="btnLogin"
                      mat-flat-button
                      color="primary"
                      style="width: 250px"
                      class="p-4"
                    >
                      Ingresar
                    </button>
                  </div>
                </form>
              </div>
            </div>
            <div class="col-lg-6 d-flex align-items-center gradient-custom-2">
              <div class="container-right"></div>
              <!-- Contenedor para la imagen de fondo con el filtro -->
              <div class="text-white px-3 py-4 p-md-5 mx-md-4 texto-encima">
                <h4 class="mb-4 text-bold">
                  Simplifica la gestión de tu negocio de forma eficiente.
                </h4>
                <p >
                  Controla tus ventas y administra tus inventarios de manera eficiente con nuestro sistema líder en el mercado.


                </p>
                <!-- <br />
                <p class="small mb-0 text-justify">
                  Ideal para llevar el control de tus ventas, tratamientos,
                  sesiones, citas, comisiones y mucho más.
                </p> -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
